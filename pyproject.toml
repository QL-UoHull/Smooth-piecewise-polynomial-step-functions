[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "smooth-piecewise-polynomial-step-functions"
version = "0.1.0"
description = "Recursive piecewise polynomial smooth step functions"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21",
    "matplotlib>=3.4",
]

[project.scripts]
smooth-step-demo = "demo:main"

[tool.setuptools]
py-modules = ["demo"]

[tool.setuptools.packages.find]
where = ["."]
include = ["smooth_step*"]
